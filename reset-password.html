<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set password: The Little Something Studio</title>
  <meta name="robots" content="noindex">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #F7F3EC;
      color: #2B2B28;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    p.lede { font-size: 0.85rem; color: #666; margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: #555; }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 1rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #C1653D;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    #error, #success {
      font-size: 0.85rem;
      margin-top: 1rem;
      display: none;
    }
    #error { color: #b3261e; }
    #success { color: #2f6b2f; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Set a new password</h1>
    <p class="lede">At least 8 characters. This link works once.</p>
    <form id="reset-form">
      <label for="password">New password</label>
      <input type="password" id="password" minlength="8" required>
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" minlength="8" required>
      <button type="submit">Set password</button>
    </form>
    <div id="error"></div>
    <div id="success"></div>
  </div>

  <script>
    var token = new URLSearchParams(location.search).get('token');
    var form = document.getElementById('reset-form');
    var errorEl = document.getElementById('error');
    var successEl = document.getElementById('success');

    if (!token) {
      form.hidden = true;
      errorEl.textContent = 'This link is missing its token. Ask the studio to send you a fresh one.';
      errorEl.style.display = 'block';
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      var password = document.getElementById('password').value;
      var confirm = document.getElementById('confirm').value;

      if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.style.display = 'block';
        return;
      }

      try {
        var res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, password: password })
        });
        var data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.error || 'Something went wrong.';
          errorEl.style.display = 'block';
          return;
        }

        form.hidden = true;
        successEl.textContent = 'Password set. You can log in now.';
        successEl.style.display = 'block';
        setTimeout(function () { window.location.href = '/login.html'; }, 1500);
      } catch (err) {
        errorEl.textContent = 'Something went wrong. Try again.';
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
