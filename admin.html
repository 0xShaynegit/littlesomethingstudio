<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin: The Little Something Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --terracotta: #C1653D;
      --forest: #3A4A3F;
      --cream: #F7F3EC;
      --charcoal: #2B2B28;
      --sage: #8FA38E;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      margin: 0;
      padding: 2rem 1.5rem;
      max-width: 820px;
      margin-inline: auto;
    }
    h1, h2 { font-family: 'Fraunces', serif; font-weight: 500; margin: 0; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    h1 { font-size: 1.6rem; color: var(--forest); }
    h2 { font-size: 1.1rem; margin: 2rem 0 1rem; color: var(--forest); }
    button {
      padding: 9px 16px; background: var(--terracotta); color: #fff; border: none;
      border-radius: 10px; cursor: pointer; font-size: 0.9rem; font-family: 'Inter', sans-serif;
    }
    #logout { background: transparent; color: var(--charcoal); border: 1px solid #d8d2c4; }

    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1rem; }
    .stat-card { background: #fff; border-radius: 14px; padding: 1rem 0.9rem; box-shadow: 0 1px 8px rgba(58,74,63,0.06); }
    .stat-label { font-size: 0.7rem; color: #7a7568; margin-bottom: 4px; }
    .stat-value { font-size: 1.25rem; font-family: 'Fraunces', serif; color: var(--forest); }

    .calendar-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 0.5rem; }
    .day-chip {
      flex-shrink: 0; min-width: 64px; text-align: center; padding: 8px 6px;
      border-radius: 10px; background: #fff; border: 1px solid #eee4d3; font-size: 0.72rem;
    }
    .day-chip.has-classes { background: #f5e2d5; border-color: #e5c19e; color: var(--terracotta); font-weight: 600; }
    .day-chip .date-label { font-size: 0.65rem; color: #9a9384; margin-top: 2px; }
    .day-chip.has-classes .date-label { color: var(--terracotta); opacity: 0.8; }

    .card {
      background: #fff; border: 1px solid #eee4d3; border-radius: 14px; padding: 1.1rem 1.3rem;
      margin-bottom: 10px; box-shadow: 0 1px 8px rgba(58,74,63,0.05);
    }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .title { font-weight: 600; font-size: 1rem; }
    .meta { font-size: 0.85rem; color: #7a7568; margin-top: 3px; }
    .status { font-size: 0.72rem; padding: 4px 11px; border-radius: 20px; flex-shrink: 0; font-weight: 500; text-transform: capitalize; }
    .status.approved { background: #e3f0e3; color: #2f6b2f; }
    .status.pending { background: #fbeecb; color: #93650c; }
    .status.declined { background: #f5dede; color: #a13a3a; }
    .actions { display: flex; gap: 8px; margin-top: 12px; border-top: 1px solid #f0ead9; padding-top: 12px; }
    .actions button { flex: 1; font-size: 0.85rem; padding: 7px; }
    .decline-btn { background: transparent; color: #a13a3a; border: 1px solid #e5c4c4; }
    #empty { color: #9a9384; font-size: 0.9rem; text-align: center; padding: 2rem 0; }
    .pending-photo, .listing-photo { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; margin-bottom: 8px; display: block; }
    .roster { margin-top: 10px; border-top: 1px solid #f0ead9; padding-top: 10px; }
    .roster-count { font-size: 0.78rem; color: #7a7568; margin-bottom: 8px; }
    .roster-row {
      display: flex; justify-content: space-between; font-size: 0.85rem;
      padding: 6px 0; border-bottom: 1px solid #f5f0e5;
    }
    .roster-empty { font-size: 0.85rem; color: #9a9384; }
    .pay-status { font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; text-transform: capitalize; }
    .pay-status.confirmed { background: #e3f0e3; color: #2f6b2f; }
    .pay-status.pending { background: #fbeecb; color: #93650c; }
    .conflict-warning {
      margin-top: 10px; padding: 8px 10px; background: #fbeecb; border: 1px solid #edd39a;
      border-radius: 8px; font-size: 0.8rem; color: #7a4e0c; line-height: 1.5;
    }
    .user-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid #f0ead9; font-size: 0.88rem;
    }
    .user-row:last-child { border-bottom: none; }
    .user-name { font-weight: 500; }
    .user-email { color: #7a7568; font-size: 0.8rem; }
    .user-row button { font-size: 0.8rem; padding: 6px 12px; }
    .no-password { color: #93650c; font-size: 0.72rem; }
    .reset-link-box {
      margin-top: 8px; padding: 8px 10px; background: #f5f0e5; border-radius: 8px;
      font-size: 0.78rem; word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="greeting">Admin</h1>
    <button id="logout">Log out</button>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Confirmed revenue</div><div class="stat-value" id="stat-revenue">...</div></div>
    <div class="stat-card"><div class="stat-label">Confirmed bookings</div><div class="stat-value" id="stat-bookings">...</div></div>
    <div class="stat-card"><div class="stat-label">Awaiting payment</div><div class="stat-value" id="stat-pending-payment">...</div></div>
    <div class="stat-card"><div class="stat-label">Facilitators</div><div class="stat-value" id="stat-facilitators">...</div></div>
  </div>

  <h2>Room calendar, next 14 days</h2>
  <div class="calendar-strip" id="calendar-strip"></div>

  <h2>Pending approval</h2>
  <div id="pending"></div>
  <h2>All listings</h2>
  <div id="all"></div>

  <h2>Pending facilitators</h2>
  <div id="pending-users"></div>

  <h2>Facilitators &amp; admin accounts</h2>
  <div class="card" id="users"></div>

  <script>
    let listings = [];

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function init() {
      const meRes = await fetch('/api/auth/me', { credentials: 'include' });
      if (!meRes.ok) { window.location.href = '/login.html'; return; }
      const { user } = await meRes.json();
      if (user.role !== 'admin') {
        document.body.innerHTML = '<p style="padding:2rem;">Not authorized.</p>';
        return;
      }
      document.getElementById('greeting').textContent = `Admin: ${user.name}`;

      await loadStats();
      await loadCalendar();
      await loadUsers();

      const res = await fetch('/api/admin/listings', { credentials: 'include' });
      const data = await res.json();
      listings = data.listings;
      render();
    }

    async function loadUsers() {
      const res = await fetch('/api/admin/users', { credentials: 'include' });
      const { users } = await res.json();

      const pending = users.filter(u => u.status === 'pending');
      const approved = users.filter(u => u.status !== 'pending');

      const pendingContainer = document.getElementById('pending-users');
      pendingContainer.innerHTML = pending.length === 0
        ? '<div id="empty">No facilitators awaiting approval.</div>'
        : pending.map(u => `
          <div class="card">
            <div class="card-top">
              <div>
                ${u.photo_key ? `<img src="/api/photo/${esc(u.photo_key)}" alt="${esc(u.name)}" class="pending-photo">` : ''}
                <div class="title">${esc(u.name)}</div>
                <div class="meta">${esc(u.email)}${u.bio ? ` &middot; ${esc(u.bio)}` : ''}</div>
              </div>
            </div>
            <div class="actions">
              <button class="decline-btn" data-decline-user="${u.id}">Decline</button>
              <button data-approve-user="${u.id}">Approve</button>
            </div>
          </div>
        `).join('');

      pendingContainer.querySelectorAll('[data-approve-user]').forEach(btn => {
        btn.addEventListener('click', () => updateUserApproval(btn.dataset.approveUser, 'approve'));
      });
      pendingContainer.querySelectorAll('[data-decline-user]').forEach(btn => {
        btn.addEventListener('click', () => updateUserApproval(btn.dataset.declineUser, 'decline'));
      });

      const container = document.getElementById('users');

      container.innerHTML = approved.map(u => `
        <div class="user-row">
          <div>
            <span class="user-name">${esc(u.name)}</span>
            <span class="user-email">&middot; ${esc(u.email)} &middot; ${esc(u.role)}</span>
            ${u.has_password ? '' : '<div class="no-password">No password set yet</div>'}
          </div>
          <button data-reset-link="${u.id}">Generate reset link</button>
        </div>
        <div class="reset-link-box" id="reset-link-${u.id}" hidden></div>
      `).join('');

      container.querySelectorAll('[data-reset-link]').forEach(btn => {
        btn.addEventListener('click', () => generateResetLink(btn.dataset.resetLink));
      });
    }

    async function updateUserApproval(userId, action) {
      const res = await fetch(`/api/admin/users/${userId}/${action}`, {
        method: 'POST',
        credentials: 'include'
      });
      if (res.ok) {
        await loadUsers();
        await loadStats();
      }
    }

    async function generateResetLink(userId) {
      const res = await fetch('/api/admin/reset-link', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ user_id: Number(userId) })
      });
      const data = await res.json();
      const box = document.getElementById(`reset-link-${userId}`);

      if (!res.ok) {
        box.textContent = data.error || 'Could not generate a link.';
        box.hidden = false;
        return;
      }

      box.innerHTML = `Send this to them (valid 24 hours):<br>${esc(data.reset_url)}`;
      box.hidden = false;
    }

    async function loadStats() {
      const res = await fetch('/api/admin/stats', { credentials: 'include' });
      const stats = await res.json();
      document.getElementById('stat-revenue').textContent = `${stats.total_revenue} THB`;
      document.getElementById('stat-bookings').textContent = stats.total_bookings;
      document.getElementById('stat-pending-payment').textContent = stats.pending_payment_bookings;
      document.getElementById('stat-facilitators').textContent = stats.active_facilitators;
    }

    async function loadCalendar() {
      const res = await fetch('/api/admin/calendar', { credentials: 'include' });
      const { calendar } = await res.json();
      const strip = document.getElementById('calendar-strip');
      strip.innerHTML = '';

      const today = new Date();
      for (let i = 0; i < 14; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() + i);
        const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const dayLabel = d.toLocaleDateString('en-US', { weekday: 'short' });
        const dateLabel = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        const hasClasses = calendar[iso] && calendar[iso].length > 0;

        const chip = document.createElement('div');
        chip.className = 'day-chip' + (hasClasses ? ' has-classes' : '');
        chip.innerHTML = `${dayLabel}<div class="date-label">${dateLabel}</div>`;
        if (hasClasses) chip.title = calendar[iso].map(c => c.title_en).join(', ');
        strip.appendChild(chip);
      }
    }

    function render() {
      const pending = listings.filter(l => l.status === 'pending');
      const pendingEl = document.getElementById('pending');
      const allEl = document.getElementById('all');

      pendingEl.innerHTML = pending.length === 0
        ? '<div id="empty">Nothing waiting on approval.</div>'
        : pending.map(cardHtml).join('');
      allEl.innerHTML = listings.map(cardHtml).join('');

      document.querySelectorAll('[data-approve]').forEach(btn => {
        btn.addEventListener('click', () => updateStatus(btn.dataset.approve, 'approved'));
      });
      document.querySelectorAll('[data-decline]').forEach(btn => {
        btn.addEventListener('click', () => updateStatus(btn.dataset.decline, 'declined'));
      });
      document.querySelectorAll('.view-attendees-btn').forEach(btn => {
        btn.addEventListener('click', () => toggleRoster(btn.dataset.id));
      });
    }

    function cardHtml(l) {
      const hasConflict = l.status === 'pending' && l.conflicts && l.conflicts.length > 0;
      const conflictWarning = hasConflict ? `
        <div class="conflict-warning">
          Clashes with ${l.conflicts.map(c => `<strong>${esc(c.title_en)}</strong> (${esc(c.facilitator_name)}, ${esc(c.start_time)} to ${esc(c.end_time)})`).join(', ')}
        </div>` : '';
      const actionButtons = l.status === 'pending' ? `
        <div class="actions">
          <button class="decline-btn" data-decline="${l.id}">Decline</button>
          <button data-approve="${l.id}">${hasConflict ? 'Approve anyway' : 'Approve'}</button>
        </div>` : '';
      return `
        <div class="card">
          <div class="card-top">
            <div>
              ${l.photo_key ? `<img src="/api/photo/${esc(l.photo_key)}" alt="${esc(l.title_en)}" class="listing-photo">` : ''}
              <div class="title">${esc(l.title_en)}</div>
              <div class="meta">${esc(l.facilitator_name)} &middot; ${esc(l.start_time)} to ${esc(l.end_time)}</div>
            </div>
            <span class="status ${esc(l.status)}">${esc(l.status)}</span>
          </div>
          ${conflictWarning}
          <div class="actions">
            <button class="view-attendees-btn" data-id="${l.id}">View attendees</button>
          </div>
          <div class="roster" id="roster-${l.id}" style="display:none;"></div>
          ${actionButtons}
        </div>`;
    }

    async function toggleRoster(listingId) {
      const rosterEl = document.getElementById(`roster-${listingId}`);
      if (rosterEl.style.display === 'block') {
        rosterEl.style.display = 'none';
        return;
      }
      const res = await fetch(`/api/my-listings/${listingId}/attendees`, { credentials: 'include' });
      if (!res.ok) {
        rosterEl.innerHTML = '<div class="roster-empty">Could not load attendees.</div>';
        rosterEl.style.display = 'block';
        return;
      }
      const { attendees, listing, spots_filled } = await res.json();
      rosterEl.innerHTML = attendees.length === 0
        ? '<div class="roster-empty">No bookings yet.</div>'
        : `<div class="roster-count">${spots_filled}${listing.capacity ? ' / ' + listing.capacity : ''} booked</div>` +
          attendees.map(a => `
            <div class="roster-row">
              <span>${esc(a.attendee_name)}${a.attendee_phone ? ' &middot; ' + esc(a.attendee_phone) : ''}</span>
              <span class="pay-status ${esc(a.payment_status)}">${esc(a.payment_status)}</span>
            </div>
          `).join('');
      rosterEl.style.display = 'block';
    }

    async function updateStatus(id, status, confirmConflict = false) {
      const res = await fetch(`/api/admin/listings/${id}/status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ status, confirm_conflict: confirmConflict })
      });

      if (res.status === 409) {
        const data = await res.json();
        const names = data.conflicts.map(c => `${c.title_en} (${c.facilitator_name})`).join(', ');
        const proceed = confirm(`This clashes with: ${names}. Approve anyway?`);
        if (proceed) {
          await updateStatus(id, status, true);
        }
        return;
      }

      const listing = listings.find(l => l.id == id);
      if (listing) listing.status = status;
      render();
      loadCalendar();
    }

    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/login.html';
    });

    init();
  </script>
</body>
</html>
