<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard: The Little Something Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --terracotta: #C1653D;
      --forest: #3A4A3F;
      --cream: #F7F3EC;
      --charcoal: #2B2B28;
      --sage: #8FA38E;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      margin: 0;
      padding: 2rem 1.5rem;
      max-width: 720px;
      margin-inline: auto;
    }
    h1, h2 { font-family: 'Fraunces', serif; font-weight: 500; margin: 0; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    h1 { font-size: 1.6rem; color: var(--forest); }
    h2 { font-size: 1.1rem; margin: 2rem 0 1rem; color: var(--forest); }
    button {
      padding: 9px 16px;
      background: var(--terracotta);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    #logout { background: transparent; color: var(--charcoal); border: 1px solid #d8d2c4; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 1rem;
    }
    .stat-card {
      background: #fff;
      border-radius: 14px;
      padding: 1.1rem 1.25rem;
      box-shadow: 0 1px 8px rgba(58,74,63,0.06);
    }
    .stat-label { font-size: 0.78rem; color: #7a7568; margin-bottom: 4px; }
    .stat-value { font-size: 1.5rem; font-family: 'Fraunces', serif; color: var(--forest); }

    .form-card {
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      box-shadow: 0 1px 10px rgba(58,74,63,0.07);
    }
    .form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .form-row > div { flex: 1; min-width: 140px; }
    label { display: block; font-size: 0.78rem; color: #7a7568; margin-bottom: 5px; }
    input, select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #e3ddd0;
      border-radius: 8px;
      font-size: 0.92rem;
      font-family: 'Inter', sans-serif;
      background: var(--cream);
    }
    #new-listing-msg { font-size: 0.85rem; margin-top: 10px; display: none; }
    #new-listing-msg.success { color: #2f6b2f; }
    #new-listing-msg.error { color: #a13a3a; }

    .card {
      background: #fff;
      border: 1px solid #eee4d3;
      border-radius: 14px;
      padding: 1.1rem 1.3rem;
      margin-bottom: 10px;
      box-shadow: 0 1px 8px rgba(58,74,63,0.05);
    }
    .listing-photo { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; margin-bottom: 8px; display: block; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .title { font-weight: 600; font-size: 1rem; }
    .meta { font-size: 0.85rem; color: #7a7568; margin-top: 3px; }
    .status {
      font-size: 0.72rem;
      padding: 4px 11px;
      border-radius: 20px;
      flex-shrink: 0;
      font-weight: 500;
      text-transform: capitalize;
    }
    .status.approved { background: #e3f0e3; color: #2f6b2f; }
    .status.pending { background: #fbeecb; color: #93650c; }
    .status.declined { background: #f5dede; color: #a13a3a; }
    #empty { color: #9a9384; font-size: 0.9rem; text-align: center; padding: 2.5rem 0; }
    .actions { margin-top: 10px; border-top: 1px solid #f0ead9; padding-top: 10px; }
    .actions button {
      background: transparent; color: var(--forest); border: 1px solid #d8d2c4;
      font-size: 0.82rem; padding: 6px 12px;
    }
    .roster { margin-top: 10px; border-top: 1px solid #f0ead9; padding-top: 10px; }
    .roster-count { font-size: 0.78rem; color: #7a7568; margin-bottom: 8px; }
    .roster-row {
      display: flex; justify-content: space-between; font-size: 0.85rem;
      padding: 6px 0; border-bottom: 1px solid #f5f0e5;
    }
    .roster-empty { font-size: 0.85rem; color: #9a9384; }
    .pay-status { font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; text-transform: capitalize; }
    .pay-status.confirmed { background: #e3f0e3; color: #2f6b2f; }
    .pay-status.pending { background: #fbeecb; color: #93650c; }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="greeting">Dashboard</h1>
    <button id="logout">Log out</button>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Total listings</div>
      <div class="stat-value" id="stat-total">...</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Approved</div>
      <div class="stat-value" id="stat-approved">...</div>
    </div>
  </div>

  <h2>New listing</h2>
  <div class="form-card">
    <form id="new-listing-form">
      <div class="form-row">
        <div>
          <label for="title">Class title</label>
          <input type="text" id="title" required>
        </div>
        <div>
          <label for="category">Category</label>
          <select id="category">
            <option value="yoga">Yoga</option>
            <option value="dance">Dance</option>
            <option value="capoeira">Capoeira</option>
            <option value="watercolour">Watercolour</option>
            <option value="movement-lab">Movement lab</option>
            <option value="sound-healing">Sound healing</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div>
          <label for="start">Start time</label>
          <input type="datetime-local" id="start" required>
        </div>
        <div>
          <label for="end">End time</label>
          <input type="datetime-local" id="end" required>
        </div>
      </div>
      <div class="form-row">
        <div>
          <label for="price">Price (THB)</label>
          <input type="number" id="price" min="0">
        </div>
        <div>
          <label for="capacity">Capacity</label>
          <input type="number" id="capacity" min="1">
        </div>
      </div>
      <div class="form-row">
        <div>
          <label for="photo">Photo (optional)</label>
          <input type="file" id="photo" accept="image/jpeg,image/png,image/webp">
        </div>
      </div>
      <button type="submit">Submit for approval</button>
      <div id="new-listing-msg"></div>
    </form>
  </div>

  <h2 id="listings-heading">My listings</h2>
  <div id="listings"></div>

  <script>
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function loadUser() {
      const meRes = await fetch('/api/auth/me', { credentials: 'include' });
      if (!meRes.ok) {
        window.location.href = '/login.html';
        return null;
      }
      const { user } = await meRes.json();
      document.getElementById('greeting').textContent = `${user.name}'s dashboard`;
      document.getElementById('listings-heading').textContent = `${user.name}'s listings`;
      return user;
    }

    async function loadListings() {
      const listingsRes = await fetch('/api/my-listings', { credentials: 'include' });
      const { listings } = await listingsRes.json();
      const container = document.getElementById('listings');

      document.getElementById('stat-total').textContent = listings.length;
      document.getElementById('stat-approved').textContent = listings.filter(l => l.status === 'approved').length;

      if (listings.length === 0) {
        container.innerHTML = '<div id="empty">No listings yet. Create one above.</div>';
        return;
      }

      container.innerHTML = listings.map(l => `
        <div class="card">
          <div class="card-top">
            <div>
              ${l.photo_key ? `<img src="/api/photo/${esc(l.photo_key)}" alt="${esc(l.title_en)}" class="listing-photo">` : ''}
              <div class="title">${esc(l.title_en)}</div>
              <div class="meta">${esc(l.start_time)} to ${esc(l.end_time)}</div>
            </div>
            <span class="status ${esc(l.status)}">${esc(l.status)}</span>
          </div>
          <div class="actions">
            <button class="view-attendees-btn" data-id="${l.id}">View attendees</button>
          </div>
          <div class="roster" id="roster-${l.id}" style="display:none;"></div>
        </div>
      `).join('');

      document.querySelectorAll('.view-attendees-btn').forEach(btn => {
        btn.addEventListener('click', () => toggleRoster(btn.dataset.id));
      });
    }

    async function toggleRoster(listingId) {
      const rosterEl = document.getElementById(`roster-${listingId}`);
      if (rosterEl.style.display === 'block') {
        rosterEl.style.display = 'none';
        return;
      }
      const res = await fetch(`/api/my-listings/${listingId}/attendees`, { credentials: 'include' });
      if (!res.ok) {
        rosterEl.innerHTML = '<div class="roster-empty">Could not load attendees.</div>';
        rosterEl.style.display = 'block';
        return;
      }
      const { attendees, listing, spots_filled } = await res.json();
      rosterEl.innerHTML = attendees.length === 0
        ? '<div class="roster-empty">No bookings yet.</div>'
        : `<div class="roster-count">${spots_filled}${listing.capacity ? ' / ' + listing.capacity : ''} booked</div>` +
          attendees.map(a => `
            <div class="roster-row">
              <span>${esc(a.attendee_name)}${a.attendee_phone ? ' &middot; ' + esc(a.attendee_phone) : ''}</span>
              <span class="pay-status ${esc(a.payment_status)}">${esc(a.payment_status)}</span>
            </div>
          `).join('');
      rosterEl.style.display = 'block';
    }

    document.getElementById('new-listing-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('new-listing-msg');
      msg.style.display = 'none';

      const body = new FormData();
      body.set('title_en', document.getElementById('title').value);
      body.set('category', document.getElementById('category').value);
      body.set('start_time', document.getElementById('start').value.replace('T', ' '));
      body.set('end_time', document.getElementById('end').value.replace('T', ' '));
      body.set('price', document.getElementById('price').value || '');
      body.set('capacity', document.getElementById('capacity').value || '');
      const photoFile = document.getElementById('photo').files[0];
      if (photoFile) body.set('photo', await window.resizeToWebp(photoFile));

      const res = await fetch('/api/my-listings', {
        method: 'POST',
        credentials: 'include',
        body
      });
      const data = await res.json();

      msg.style.display = 'block';
      if (res.ok) {
        msg.className = 'success';
        msg.textContent = 'Submitted. Waiting on admin approval.';
        document.getElementById('new-listing-form').reset();
        loadListings();
      } else {
        msg.className = 'error';
        msg.textContent = data.error || 'Something went wrong.';
      }
    });

    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/login.html';
    });

    (async () => {
      const user = await loadUser();
      if (user) await loadListings();
    })();
  </script>
</body>
</html>
